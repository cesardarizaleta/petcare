version: '3.8'

# Definimos la red externa de Dokploy para que Traefik pueda comunicarse con nuestros contenedores
networks:
  dokploy-network:
    external: true

services:
  # Backend API Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petcare-backend
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=${DATABASE_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - SECURE_SSL_REDIRECT=False
    networks:
      - dokploy-network
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.petcare-backend.rule=Host(`bpetcare.irissoftware.lat`)"
      - "traefik.http.services.petcare-backend.loadbalancer.server.port=8000"
      # Si Dokploy maneja SSL globalmente, estas siguientes dos líneas aseguran que use HTTPS
      - "traefik.http.routers.petcare-backend.entrypoints=websecure"
      - "traefik.http.routers.petcare-backend.tls.certresolver=letsencrypt"

  # Frontend Unificado -> Código completo de frontend2 con login único para todos los roles
  frontend:
    build:
      context: ./frontend2
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://bpetcare.irissoftware.lat
    container_name: petcare-frontend
    restart: always
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.petcare-frontend.rule=Host(`petcare.irissoftware.lat`)"
      - "traefik.http.services.petcare-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.petcare-frontend.entrypoints=websecure"
      - "traefik.http.routers.petcare-frontend.tls.certresolver=letsencrypt"


