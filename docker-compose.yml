version: '3.8'

# Definimos la red externa de Dokploy para que Traefik pueda comunicarse con nuestros contenedores
networks:
  dokploy-network:
    external: true

services:
  # Backend API Django
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: petcare-backend
    restart: always
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=${DATABASE_URL}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - SECURE_SSL_REDIRECT=False
    networks:
      - dokploy-network
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.petcare-backend.rule=Host(`bpetcare.irissoftware.lat`)"
      - "traefik.http.services.petcare-backend.loadbalancer.server.port=8000"
      # Si Dokploy maneja SSL globalmente, estas siguientes dos líneas aseguran que use HTTPS
      - "traefik.http.routers.petcare-backend.entrypoints=websecure"
      - "traefik.http.routers.petcare-backend.tls.certresolver=letsencrypt"

  # Frontend antiguo (Comentado/Unificado con el principal en frontend2)
  # frontend-owner:
  #   build:
  #     context: ./frontend1
  #     dockerfile: Dockerfile
  #     args:
  #       - VITE_API_BASE_URL=https://bpetcare.irissoftware.lat
  #   container_name: petcare-frontend-owner
  #   restart: always
  #   networks:
  #     - dokploy-network
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.petcare-frontend-owner.rule=Host(`f1.irissoftware.lat`)"
  #     - "traefik.http.services.petcare-frontend-owner.loadbalancer.server.port=80"
  #     - "traefik.http.routers.petcare-frontend-owner.entrypoints=websecure"
  #     - "traefik.http.routers.petcare-frontend-owner.tls.certresolver=letsencrypt"

  # Frontend Unificado de PetCare (Soporta los 5 roles: Owner, Vet, Receptionist, Technician, Manager)
  frontend-unified:
    build:
      context: ./frontend2
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=https://bpetcare.irissoftware.lat
    container_name: petcare-frontend-unified
    restart: always
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.petcare-frontend-unified.rule=Host(`f1.irissoftware.lat`) || Host(`f2.irissoftware.lat`)"
      - "traefik.http.services.petcare-frontend-unified.loadbalancer.server.port=80"
      - "traefik.http.routers.petcare-frontend-unified.entrypoints=websecure"
      - "traefik.http.routers.petcare-frontend-unified.tls.certresolver=letsencrypt"

